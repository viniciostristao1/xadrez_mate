name: xadrez_mate
description: "Treinador de xeque-mate: problemas de mate em 1, 2 ou 3 lances."
publish_to: 'none'

version: 0.11.0+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles.json
    - assets/tatica.json
    - assets/defesa.json
    - assets/icon/app_icon.png
    - assets/pieces/merida/
    - assets/pieces/cburnett/
    - assets/pieces/leipzig/

flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
