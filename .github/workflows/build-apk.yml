name: Build APK

# Gera APK (release, split por ABI) na nuvem a cada push no app — a VPS é
# fraca p/ compilar Android. Publica no release rolling "ci-latest"; o
# scripts/release.sh corta o release nomeado com asset de nome fixo
# (xadrez-mate.apk = link perene).
#
# Tolerante a secrets ausentes: sem KEYSTORE_BASE64 → assina em debug
# (instala mesmo assim).
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      - name: Assinatura de release (só se a keystore estiver nos secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
            cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
            echo "Keystore de upload aplicada."
          else
            echo "Sem keystore nos secrets → build cai na assinatura DEBUG (instala mesmo assim)."
          fi

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: Build APK (release, por ABI)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Publica APK no release ci-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: CI build (rolling — APK arm64 do último push)
          prerelease: true
          files: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
